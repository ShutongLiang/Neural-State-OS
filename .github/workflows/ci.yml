name: public-release-audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q demo src scripts tests
      - run: python scripts/verify_direct44_bundle.py
      - run: python scripts/verify_direct44_31b_bundle.py
      - run: python -m pytest -q
